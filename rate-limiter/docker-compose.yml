# Local Redis plus a GUI to watch your keys change.
#   docker compose up -d        start
#   docker compose down         stop
# Redis:        localhost:6379
# Redis Insight: http://localhost:5540  (add database: host "redis", port 6379)
services:
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  redis-insight:
    image: redis/redisinsight:3.6
    ports: ["5540:5540"]
    depends_on: [redis]
